# Fly config — prod hbbr (Cyberdriver relay server, production)
# Deployed to: cyberdriver-server-hbbr-iad-prod
# Public DNS: hbbr.cyberdesk.io (A record managed in Cloudflare)
#
# Stateless TCP relay; no volume needed.

app             = "cyberdriver-server-hbbr-iad-prod"
primary_region  = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  CYBERDRIVER_ROLE = "hbbr"
  RUST_LOG         = "info"

[[vm]]
  size        = "shared-cpu-1x"
  memory      = "512mb"

# Relay TCP port (where peers stream their video/audio when NAT punch fails).
# Carries the TCP health check (zero-downtime gate for bluegreen).
[[services]]
  internal_port = 21117
  protocol      = "tcp"
  [[services.ports]]
    port = 21117
  [[services.tcp_checks]]
    interval      = "10s"
    timeout       = "2s"
    grace_period  = "10s"

# WebSocket relay (web-client fallback path).
[[services]]
  internal_port = 21119
  protocol      = "tcp"
  [[services.ports]]
    port = 21119

[deploy]
  # No volume → bluegreen works perfectly. Fly runs new + old machines
  # in parallel, only cuts traffic over once the new machine passes the
  # TCP health check on 21117. Zero-downtime for clients in mid-relay
  # session AND for new connection attempts.
  strategy           = "bluegreen"
  wait_timeout       = "5m"
